<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="72" height="72" fill="none" role="img" aria-label="Abyssal Liturgy mark">
<title>Abyssal Liturgy mark</title>
<style>.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 3.4s ease-in-out infinite}@keyframes pulse{0%,100%{transform:scale(.85)}50%{transform:scale(1.25)}}.r1{animation:rr 5s ease-in-out infinite}.r2{animation:rr 5s ease-in-out -1.6s infinite}.r3{animation:rr 5s ease-in-out -3.2s infinite}@keyframes rr{0%,100%{stroke-opacity:.18}50%{stroke-opacity:.95}}.ln{animation:ln 5s ease-in-out infinite}@keyframes ln{0%,100%{stroke-opacity:.25}50%{stroke-opacity:.6}}.rip{transform-box:fill-box;transform-origin:center;animation:rip 5s ease-out infinite}@keyframes rip{0%{transform:scale(1);opacity:.5}100%{transform:scale(2.6);opacity:0}}@media (prefers-reduced-motion:reduce){*{animation:none!important}.motion{display:none}}</style>
<circle class="r1" cx="50" cy="50" r="46" stroke="#e9e4da" stroke-opacity="0.9"/>
<circle class="r2" cx="50" cy="50" r="32" stroke="#e9e4da" stroke-opacity="0.55"/>
<circle class="r3" cx="50" cy="50" r="18" stroke="#e9e4da" stroke-opacity="0.3"/>
<line class="ln" x1="50" y1="4" x2="50" y2="96" stroke="#e9e4da" stroke-opacity="0.4"/>
<circle class="rip motion" cx="50" cy="50" r="18" stroke="#e9e4da" stroke-opacity=".5"/>
<circle class="pulse" cx="50" cy="50" r="3" fill="#e9e4da"/>
<g class="motion"><circle r="3" fill="#e9e4da"><animateMotion dur="16s" repeatCount="indefinite" path="M82 50 A32 32 0 1 1 18 50 A32 32 0 1 1 82 50"/></circle></g>
</svg>
