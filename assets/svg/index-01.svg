<style>.orbit{stroke-dasharray:.12 .88;animation:orbit 7s linear infinite}@keyframes orbit{to{stroke-dashoffset:-1}}.caret{animation:caret 1.1s steps(1,end) infinite}@keyframes caret{50%{opacity:0}}.num{animation:num 6s ease-in-out infinite}@keyframes num{0%,100%{fill:#6d727b}50%{fill:#9a9d95}}@media (prefers-reduced-motion:reduce){*{animation:none!important}.motion{display:none}}</style>
