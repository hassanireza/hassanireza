<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 2" width="100%" height="2" role="presentation">
<style>.sw{animation:sw 10s ease-in-out infinite}@keyframes sw{0%{transform:translateX(-240px)}65%,100%{transform:translateX(1200px)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}.motion{display:none}}</style>
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e9e4da" stop-opacity="0"/><stop offset=".5" stop-color="#e9e4da" stop-opacity=".7"/><stop offset="1" stop-color="#e9e4da" stop-opacity="0"/></linearGradient></defs>
<line x1="0" y1="1" x2="1200" y2="1" stroke="#2b3038" stroke-width="1"/>
<rect class="sw motion" x="0" y="0" width="240" height="2" fill="url(#g)"/>
</svg>
