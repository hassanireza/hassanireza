<svg width="56" height="56" viewBox="0 0 56 56" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Undertow mark">
  <defs>
    <radialGradient id="ut-glow" cx="50%" cy="18%" r="70%">
      <stop offset="0%" stop-color="#e9e4da" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#e9e4da" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <circle cx="28" cy="28" r="27.5" fill="#050506" stroke="#2b3038" stroke-width="1"/>
  <circle cx="28" cy="28" r="27.5" fill="url(#ut-glow)"/>

  <!-- surface line: calm, unbroken -->
  <line x1="9" y1="21" x2="47" y2="21" stroke="#6d727b" stroke-width="1" stroke-linecap="round"/>

  <!-- the undertow: one current pulled below the surface, single continuous stroke -->
  <path d="M 9 21 C 17 21, 19 33, 28 33 C 37 33, 39 21, 47 21"
        fill="none" stroke="#e9e4da" stroke-width="1.6" stroke-linecap="round"/>

  <!-- depth marker, the single point of tension -->
  <circle cx="28" cy="33" r="2" fill="#3c4b46" stroke="#e9e4da" stroke-width="0.75"/>
</svg>
