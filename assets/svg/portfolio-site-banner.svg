<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="140" viewBox="0 0 1200 140" role="img" aria-label="Portfolio website preview: hassanireza.github.io. React, TypeScript, Vite, deployed on every push."><title>Portfolio website preview: hassanireza.github.io. React, TypeScript, Vite, deployed on every push.</title><style>.breathe{animation:breathe 8s ease-in-out infinite}@keyframes breathe{0%,100%{opacity:.55}50%{opacity:1}}.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 3.4s ease-in-out infinite}@keyframes pulse{0%,100%{transform:scale(.85)}50%{transform:scale(1.25)}}.orbit{stroke-dasharray:.05 .95;animation:orbit 11s linear infinite}@keyframes orbit{to{stroke-dashoffset:-1}}.bar{animation:bar 4s ease-in-out infinite}@keyframes bar{0%,100%{opacity:.5}50%{opacity:1}}.nudge{animation:nudge 3.6s ease-in-out infinite}@keyframes nudge{0%,55%,100%{transform:translate(0,0)}78%{transform:translate(2.5px,-2.5px)}}.bl{animation:bl 3s steps(1,end) infinite}.b2{animation-delay:-1.5s}@keyframes bl{0%{stroke-opacity:1}50%{stroke-opacity:.2}}.st{animation:st 9s ease-in-out infinite}@keyframes st{0%{fill:#6d727b}4%,15%{fill:#e9e4da}24%,100%{fill:#6d727b}}@media (prefers-reduced-motion:reduce){*{animation:none!important}.motion{display:none}}</style><defs><radialGradient id="g" cx="50%" cy="0%" r="90%"><stop offset="0" stop-color="#5f7a6f" stop-opacity=".10"/><stop offset="1" stop-color="#050506" stop-opacity="0"/></radialGradient></defs><rect width="1200" height="140" fill="#050506"/><rect class="breathe" width="1200" height="140" fill="url(#g)"/><rect x="40" y="20" width="1120" height="100" rx="2" fill="#111318" stroke="#2b3038" stroke-width="1"/><rect class="bar" x="40" y="20" width="2" height="100" fill="#5f7a6f"/><g transform="translate(72 54) scale(1.4)" fill="none" stroke="#8da398" stroke-width="0.857" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="1"/><path d="M3 9h18"/><path class="bl" d="M6.5 6.5h.01"/><path class="bl b2" d="M9 6.5h.01"/></g><text x="130" y="66" font-family="'Cormorant Garamond', Georgia, 'Times New Roman', serif" font-size="34" fill="#e9e4da" text-anchor="start" font-style="italic" font-weight="300" letter-spacing="0">hassanireza.github.io</text><text x="130" y="94" font-family="'JetBrains Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#6d727b" text-anchor="start" font-style="normal" font-weight="400" letter-spacing="2"><tspan class="st" style="animation-delay:0s">REACT</tspan> · <tspan class="st" style="animation-delay:1.6s">TYPESCRIPT</tspan> · <tspan class="st" style="animation-delay:3.2s">VITE</tspan> · <tspan class="st" style="animation-delay:4.8s">DEPLOYED ON EVERY PUSH</tspan></text><g transform="translate(1100 54) scale(1.2)" fill="none" stroke="#6d727b" stroke-width="1.000" stroke-linecap="round" stroke-linejoin="round"><g class="nudge"><path d="M7 17L17 7M9 7h8v8"/></g></g><circle class="pulse" cx="1034" cy="68" r="3" fill="#8da398"/><circle class="pulse" cx="1034" cy="68" r="7" fill="#8da398" fill-opacity=".18"/><text x="1046" y="71.5" font-family="'JetBrains Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="9" letter-spacing="2" fill="#6d727b">LIVE</text><rect class="orbit motion" x="40" y="20" width="1120" height="100" rx="2" pathLength="1" fill="none" stroke="#e9e4da" stroke-opacity="0.55" stroke-width="1" stroke-linecap="round" style="animation-delay:-3s"/></svg>
