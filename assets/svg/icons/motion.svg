<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#8da398" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="motion"><title>motion</title><style>.pul{transform-box:fill-box;transform-origin:center;animation:pul 3s ease-in-out infinite}@keyframes pul{0%,100%{transform:scale(.9)}50%{transform:scale(1.25)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}.motion{display:none}}</style><circle class="pul" cx="5" cy="18" r="1.6"/><circle class="pul" style="animation-delay:-1.5s" cx="19" cy="6" r="1.6"/><path d="M6.5 17C12 17 12 7 17.5 7"/><g class="motion"><circle r="1.1" fill="#e9e4da" stroke="none"><animateMotion dur="3s" repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines=".55 0 .35 1" path="M6.5 17C12 17 12 7 17.5 7"/></circle></g></svg>
