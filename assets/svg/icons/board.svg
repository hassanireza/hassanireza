<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#8da398" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="board"><title>board</title><style>.hop{animation:hop 8s cubic-bezier(.6,0,.3,1) infinite}@keyframes hop{0%,9%{transform:translate(0px,0px)}12.5%,21.5%{transform:translate(6px,12px)}25%,34%{transform:translate(12px,0px)}37.5%,46.5%{transform:translate(0px,6px)}50%,59%{transform:translate(12px,12px)}62.5%,71.5%{transform:translate(6px,0px)}75%,84%{transform:translate(0px,12px)}87.5%,96.5%{transform:translate(12px,6px)}100%{transform:translate(0,0)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}.motion{display:none}}</style><rect x="3" y="3" width="18" height="18" rx="1"/><path d="M9 3v18M15 3v18M3 9h18M3 15h18"/><rect class="hop motion" x="3" y="3" width="6" height="6" fill="#e9e4da" fill-opacity=".42" stroke="none"/></svg>
