<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#8da398" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="accessibility"><title>accessibility</title><style>.pg{transform-box:fill-box;transform-origin:center;animation:pg 3.6s ease-out infinite}@keyframes pg{0%{transform:scale(1.6);opacity:.55}100%{transform:scale(3.4);opacity:0}}.pul{transform-box:fill-box;transform-origin:center;animation:pul 3s ease-in-out infinite}@keyframes pul{0%,100%{transform:scale(.9)}50%{transform:scale(1.2)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}.motion{display:none}}</style><circle class="pul" cx="12" cy="5" r="1.8"/><circle class="pg motion" cx="12" cy="5" r="1.8" stroke="#e9e4da"/><path d="M5 8.5l7 1.5 7-1.5M12 10v5M9 21l3-6 3 6"/></svg>
